<!doctype html>
<html lang="en" data-theme="feltwork">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="description" content="Rack Five — a word game played like Yahtzee. Build five words, turn their lengths into ranks, fill one scorecard.">
<title>Rack Five</title>

<!-- Tablet-first, so the home-screen and browser-chrome treatment matters as
     much as the page itself. theme-color is what tints Safari's toolbars. -->
<link rel="icon" href="./assets/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="./assets/apple-touch-icon.png">
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#0e1a17">
<meta name="apple-mobile-web-app-title" content="Rack Five">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">

<meta property="og:type" content="website">
<meta property="og:title" content="Rack Five">
<meta property="og:description" content="A word game played like Yahtzee. Build five words, turn their lengths into ranks, fill one scorecard.">
<meta property="og:image" content="./assets/icon-512.png">
<meta name="twitter:card" content="summary">

<link rel="stylesheet" href="./assets/fonts/fonts.css">
<link rel="stylesheet" href="./styles/tokens.css">
<link rel="stylesheet" href="./styles/base.css">
<link rel="stylesheet" href="./styles/screens.css">
<link rel="stylesheet" href="./styles/game.css">

<!-- Vendored, self-hosted. No CDN at runtime, no build step. -->
<script type="importmap">
{
  "imports": {
    "preact": "./vendor/preact.module.js",
    "preact/hooks": "./vendor/hooks.module.js",
    "htm": "./vendor/htm.module.js"
  }
}
</script>
</head>
<body>
<div id="root"></div>
<noscript>Rack Five needs JavaScript enabled.</noscript>
<script type="module" src="./src/main.js"></script>
</body>
</html>
